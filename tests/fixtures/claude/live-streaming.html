      <div class="min-w-0 message-fade-up" data-transcript-live="">
        <div class="grid grid-cols-1 content-start gap-5">

            <div class="contents">
              <div class="prose" data-cds="" data-prose-font="" data-prose-heading-size="" data-prose-tables="">

              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <fieldset><div class="ProseMirror" contenteditable="true"><p></p></div></fieldset>
</main></div>
