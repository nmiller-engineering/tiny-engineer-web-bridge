name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run lint:firefox
      - name: Package (twice, must be identical)
        run: |
          npm run package
          sha256sum web-ext-artifacts/*.xpi | tee first.sha
          npm run package
          sha256sum -c first.sha
      - uses: actions/upload-artifact@v4
        with:
          name: tiny-engineer-web-bridge-xpi
          path: web-ext-artifacts/*.xpi
