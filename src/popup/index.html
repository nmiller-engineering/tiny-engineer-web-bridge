<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tiny Engineer Web Bridge</title>
    <link rel="stylesheet" href="../shared/ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <img src="../icons/icon.svg" alt="" width="28" height="28" />
      <div class="brand">
        <h1>Tiny Engineer</h1>
        <p class="muted small">Web Bridge</p>
      </div>
      <span class="pill" id="connection" data-tone="warn">Checking…</span>
    </header>

    <main>
      <!-- The one big control: robot link on/off -->
      <button type="button" class="power" id="power" aria-pressed="true">
        <span class="power-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 3v8" /><path d="M6.4 6.6a8 8 0 1 0 11.2 0" /></svg>
        </span>
        <span class="power-text">
          <strong id="power-label">Robot link on</strong>
          <span id="power-hint">Click to turn off</span>
        </span>
      </button>

      <!-- Shown until a robot is configured -->
      <section class="card welcome" id="welcome" hidden>
        <h2>Connect your robot</h2>
        <p class="muted">Enter your Tiny Engineer's address (or pick it over USB) in the dashboard.</p>
      </section>

      <section class="card activity" id="activity" aria-live="polite">
        <div class="state" id="state" data-state="idle">
          <span class="dot" aria-hidden="true"></span>
          <span id="state-label">Idle</span>
        </div>
        <p class="source" id="source">No supported AI tab open</p>
        <div class="robot-line">
          <span class="muted">Robot</span>
          <span class="anim" id="robot-animation">–</span>
          <span class="muted small" id="last-sent"></span>
        </div>
      </section>

      <p class="notice" id="notice" data-tone="warn" hidden></p>
      <p class="notice" id="result" data-tone="ok" role="status" hidden></p>
    </main>

    <footer class="actions">
      <button type="button" class="btn block" id="dashboard">Open dashboard</button>
      <div class="sub-actions">
        <button type="button" class="linklike" id="test">Test connection</button>
        <span class="muted small" id="link"></span>
      </div>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
